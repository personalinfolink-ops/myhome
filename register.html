
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - TaskBridge</title>

    <meta name="description" content="Create your free TaskBridge account and discover global micro job opportunities.">

    <!-- Registration CSS will be connected here -->
    <link rel="stylesheet" href="./register.css">
</head>

<body>

    <!-- Registration Page -->
    <main class="register-page">

        <div class="register-container">

            <!-- Brand -->
            <div class="register-brand">
                <a href="index.html" class="logo">
                    Task<span>Bridge</span>
                </a>

                <p>Your Global Micro Jobs Marketplace</p>
            </div>

            <!-- Registration Form -->
            <div class="register-card">

                <div class="register-heading">
                    <h1>Create Your Account</h1>

                    <p>
                        Join TaskBridge and explore opportunities
                        from around the world.
                    </p>
                </div>

                <form id="registerForm">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name</label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <!-- Username -->
                    <div class="form-group">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            minlength="3"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- Country -->
                    <div class="form-group">
                        <label for="country">Country</label>

                        <select
                            id="country"
                            name="country"
                            autocomplete="country-name"
                            required
                        >
                            <option value="">Select your country</option>
                            <option value="Bangladesh">Bangladesh</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="Australia">Australia</option>
                            <option value="Germany">Germany</option>
                            <option value="France">France</option>
                            <option value="Pakistan">Pakistan</option>
                            <option value="Nigeria">Nigeria</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Account Type -->
                    <div class="form-group">
                        <label for="accountType">
                            What best describes you?
                        </label>

                        <select
                            id="accountType"
                            name="accountType"
                            required
                        >
                            <option value="">Select an option</option>
                            <option value="worker">
                                Worker - I want to complete tasks
                            </option>
                            <option value="advertiser">
                                Advertiser - I want to post tasks
                            </option>
                            <option value="both">
                                Both - I want to do both
                            </option>
                        </select>

                        <small>
                            You can find jobs and post jobs using
                            the same account.
                        </small>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <!-- Terms -->
                    <div class="form-checkbox">
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required
                        >

                        <label for="terms">
                            I agree to the
                            <a href="terms.html">
                                Terms & Conditions
                            </a>
                            and
                            <a href="privacy.html">
                                Privacy Policy
                            </a>.
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="register-button">
                        Create Account
                    </button>

                </form>

                <!-- Login Link -->
                <div class="login-link">
                    <p>
                        Already have an account?
                        <a href="login.html">Log In</a>
                    </p>
                </div>

            </div>

            <!-- Footer -->
            <div class="register-footer">
                <p>
                    &copy; <span id="current-year">2026</span>
                    TaskBridge. All Rights Reserved.
                </p>
            </div>

        </div>

    </main>

    <!-- Registration JavaScript will be connected here -->
    <script src="./register.js"></script>

</body>
</html>
